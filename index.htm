<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Using JavaScript safely processes exceptionally long links containing encoded hashes
        window.location.href = "https://tinyurl.com/3xnys2sx";
    </script>
</head>
<body>
    <p>If you are not redirected automatically, follow this <a id="fallback-link" href="https://tinyurl.com/3xnys2sx">link to the destination</a>.</p>
    <script type="text/javascript">
        // Mirror the destination link onto the anchor tag just in case
        document.getElementById("fallback-link").href = window.location.href;
    </script>
</body>
</html>
